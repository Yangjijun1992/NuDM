name: NuDM CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nudm
          POSTGRES_PASSWORD: nudm_password
          POSTGRES_DB: nudm
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend/[dev]"
        working-directory: backend

      - name: Lint (ruff)
        run: ruff check app/
        working-directory: backend
        continue-on-error: true

      - name: Run unit + API tests
        env:
          DATABASE_URL: postgresql+asyncpg://nudm:nudm_password@localhost:5432/nudm
          DATABASE_URL_SYNC: postgresql://nudm:nudm_password@localhost:5432/nudm
          SECRET_KEY: ci-test-secret-key
        run: pytest tests/ -v --tb=short
        working-directory: backend

      - name: Run Alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://nudm:nudm_password@localhost:5432/nudm
        run: alembic upgrade head
        working-directory: backend

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint (ESLint)
        run: npx eslint src/ --max-warnings=50
        working-directory: frontend
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  docker-build:
    name: Docker Image Build
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t nudm-backend ./backend

      - name: Build frontend image
        run: docker build -t nudm-frontend ./frontend

      - name: Verify images
        run: |
          docker images nudm-backend
          docker images nudm-frontend
